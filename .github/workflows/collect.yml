name: Biz Digest

on:
  schedule:
    - cron: '30 4 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning or evening'
        required: false
        default: 'morning'

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Fetch currency rates (NBU + Privat)
        run: python3 fetch_rates.py

      - name: Collect + translate + enrich + validate (pipeline v9)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 rss_collector_v9.py

      - name: Set mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode || 'morning' }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(TZ='Europe/Kyiv' date +%H)
            if [ "$HOUR" -lt 14 ]; then
              echo "mode=morning" >> $GITHUB_OUTPUT
            else
              echo "mode=evening" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Generate and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PAGES_URL: https://pointrade.business
        run: python3 magazine_generator.py --${{ steps.mode.outputs.mode }}

      - name: Notify failure
        if: failure()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="⚠️ Pointrade digest FAILED $(date +'%Y-%m-%d %H:%M')"
          fi

      - name: Commit
        run: |
          git config user.name "BizDigest Bot"
          git config user.email "bot@biz-digest"
          git add data/ magazines/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Digest $(date +'%Y-%m-%d %H:%M')"
          git push
